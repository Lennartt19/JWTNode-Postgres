name: CI

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Ver archivos
        run: ls -la

      - name: Leer Dockerfile
        run: cat dockerfile

      - name: Build Docker image
        run: docker build -t backend-app .
      
      - name: Build DOCKER-COMPOSE
        run: docker-compose up -d
      
      - name: docker contenedores Activos
        run: docker ps