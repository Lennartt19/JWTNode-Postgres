name: CI

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Ver archivos
        run: ls -la

      - name: Leer Dockerfile
        run: cat dockerfile

      - name: Build Docker image
        run: docker build -t backend-app:v1.0.0 .
      
      - name: Visualizar las imagenes de Docker
        run: docker images
      
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Tag Docker image
        run: docker tag backend-app:v1.0.0 ${{ secrets.DOCKER_USERNAME }}/backend-app:v1.0.0
      
      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/backend-app:v1.0.0